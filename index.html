<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뱅쏭픽 · 꿀템 모음</title>
<style>
:root{--bg:#faf6ee;--ink:#222a3d;--muted:#7a7f90;--line:#eadfce;--card:#fffdf8;--acc:#ff6b4a;--acc-d:#e0502f;--chip:#f3ebdd;--soft:#fff0e8;--shadow:0 2px 10px rgba(80,60,30,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14182a;--ink:#f1efe9;--muted:#a3a9bd;--line:#2b3250;--card:#1c2240;--chip:#252c4d;--soft:#2a2540;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 16px}
.notice{font-size:12px;color:#5f7a4a;background:#e9f1e0;border-radius:10px;padding:8px 12px;text-align:center}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .notice{background:#25304a;color:#b9c8a8}}
.hero{display:flex;gap:14px;align-items:center;padding:20px 0 10px}
.logo{flex:0 0 auto;width:112px;height:112px;border-radius:50%;border:3px solid var(--card);box-shadow:var(--shadow);background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:30px;font-weight:900;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-size:32px;letter-spacing:-.03em;line-height:1.1}h1 span{color:var(--acc)}
.tag{color:var(--muted);margin:4px 0 0}
.pill{margin:10px 0 4px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:700;color:var(--ink)}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 4px}
.sbox{position:relative}.sbox::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px}
input[type=search]{width:100%;padding:13px 16px 13px 40px;border:1px solid var(--line);border-radius:999px;font:inherit;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px;font:inherit;cursor:pointer;transition:background .15s}
.chip:hover{background:var(--chip)}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.count{color:var(--muted);font-size:13px;margin:2px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
@media(hover:hover){.card:hover{transform:translateY(-3px)}}
.img{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,var(--chip),var(--soft));display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.no{position:absolute;right:10px;top:10px;background:var(--card);color:var(--ink);font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;box-shadow:var(--shadow)}
.new{position:absolute;left:10px;top:10px;background:#ffe9a8;color:#6b4a00;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{align-self:flex-start;font-size:12px;color:var(--acc-d);background:var(--soft);font-weight:700;border-radius:999px;padding:1px 9px}
.name{font-weight:800;font-size:16px;line-height:1.35}.desc{color:var(--muted);font-size:13px;flex:1;min-height:0}
.btn{display:block;text-align:center;text-decoration:none;background:var(--ink);color:var(--bg);font-weight:800;border-radius:12px;padding:12px;margin-top:8px;transition:background .15s}
.btn:hover{background:var(--acc)}.btn.off{background:var(--chip);color:var(--muted);pointer-events:none}
.empty{text-align:center;color:var(--muted);padding:56px 12px}
footer{color:var(--muted);font-size:12px;padding:28px 0 44px;text-align:center}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}h1{font-size:26px}.logo{width:92px;height:92px;font-size:24px}.name{font-size:14px}.body{padding:10px}.btn{padding:10px;font-size:13px}}
@media(prefers-reduced-motion:reduce){.card,.chip,.btn{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="notice" id="disc"></div>
  <header class="hero"><div class="logo" id="logo"><img src="logo.png" alt="" onerror="this.remove()"><b id="logoText"></b></div><div><h1 id="brand"></h1><p class="tag" id="tag"></p></div></header>
  <div class="pill" id="pill"></div>
  <div class="search"><div class="sbox"><input type="search" id="q" placeholder="번호나 이름으로 검색" aria-label="상품 검색"></div></div>
  <div class="chips" id="chips" role="group" aria-label="카테고리"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>찾는 상품이 없어요. 번호나 다른 단어로 검색해 보세요.</div>
  <footer id="foot"></footer>
</div>
<script src="data.js"></script>
<script>
const PLATFORMS=['youtube','instagram','facebook','tiktok','threads'];
/* 방문 출처: ?utm_source=youtube 등. 같은 탭에서는 기억해요. 출처가 없으면 null(어느 플랫폼에도 배정하지 않음) */
function detectSource(){
  let s=null;
  try{s=(new URLSearchParams(location.search).get('utm_source')||'').toLowerCase()}catch(e){}
  if(PLATFORMS.includes(s)){try{sessionStorage.setItem('src',s)}catch(e){}return s}
  try{const k=sessionStorage.getItem('src');if(PLATFORMS.includes(k))return k}catch(e){}
  return null;
}
/* 출처에 맞게 미리 등록한 링크를 고른다. 없으면 공용 링크, 그것도 없으면 null. 링크 문자열은 절대 바꾸지 않는다. */
function resolveLink(p,source){
  const L=p.links||{};
  if(source&&L[source]&&L[source].trim())return {url:L[source].trim(),kind:source};
  if(L.default&&L.default.trim())return {url:L.default.trim(),kind:'default'};
  return null;
}
const S=window.SITE, SRC=detectSource();
let cat='전체';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 사진 주소를 안 적었다면 images/번호.jpg → .png → .webp → .jpeg 순서로 찾아요 */
const EXTS=['jpg','png','webp','jpeg'];
function imgFail(el){const n=el.dataset.n;if(!n){el.remove();return}
  const i=+(el.dataset.i||0)+1;if(i>=EXTS.length){el.remove();return}
  el.dataset.i=i;el.src=`images/${n}.${EXTS[i]}`}
let newest=new Set();
/* BSP_SCHEDULE_V1: publish_at이 있으면 공개시각 전까지 숨기고 이후 자동 노출 */
function isProductVisible(p){
  if(p.publish_at){
    const t=Date.parse(p.publish_at);
    return Number.isFinite(t)&&Date.now()>=t;
  }
  return p.status!=='hidden';
}
function visible(){return (S.products||[]).filter(isProductVisible)}
function render(){
  const all=visible(); newest=new Set([...all].sort((a,b)=>b.no-a.no).slice(0,3).map(p=>p.no)); const q=document.getElementById('q').value.trim().toLowerCase();
  const cats=['전체',...new Set(all.map(p=>p.cat).filter(Boolean))];
  document.getElementById('chips').innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const list=all.filter(p=>(cat==='전체'||p.cat===cat)&&(!q||String(p.no)===q.replace(/번$/,'')||p.name.toLowerCase().includes(q)||String(p.no).includes(q)));
  document.getElementById('count').textContent=`${list.length}개의 추천템`;
  document.getElementById('empty').hidden=list.length>0;
  document.getElementById('grid').innerHTML=list.map(p=>{
    const sold=p.status==='soldout', r=resolveLink(p,SRC);
    const btn=sold?'<span class="btn off">품절 · 현재 구매할 수 없어요</span>':r?`<a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener sponsored">쿠팡에서 보기 →</a>`:'<span class="btn off">링크 준비 중</span>';
    const src=p.img||`images/${p.no}.jpg`;  // 주소를 안 적으면 images/번호.jpg 파일을 자동으로 찾아요
    const isNew=newest.has(p.no);
    return `<article class="card"><div class="img"><span>이미지 준비 중</span><img src="${esc(src)}" alt="${esc(p.name)}" loading="lazy" ${p.img?'':`data-n="${esc(p.no)}"`} onerror="imgFail(this)">${isNew?'<span class="new">NEW</span>':''}<span class="no">${esc(p.no)}번</span></div>
    <div class="body">${p.cat?`<span class="cat">${esc(p.cat)}</span>`:''}<div class="name">${esc(p.name)}</div>${p.desc?`<div class="desc">${esc(p.desc)}</div>`:'<div class="desc"></div>'}${btn}</div></article>`}).join('');
}
document.getElementById('logoText').textContent=S.brand.name.charAt(0);
document.getElementById('pill').textContent=S.brand.pill||'10초 안에 보고, 마음에 들면 골라보세요 ♡';
document.getElementById('brand').innerHTML=esc(S.brand.name).replace(/(.)$/,'<span>$1</span>');
document.getElementById('tag').textContent=S.brand.tagline;
document.getElementById('disc').textContent=S.brand.disclosure;
document.getElementById('foot').textContent='가격과 재고는 판매처에서 달라질 수 있어요. 구매 전 판매처에서 확인해 주세요.';
document.getElementById('q').addEventListener('input',render);
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){cat=b.dataset.c;render()}});
render();
setInterval(()=>{if((S.products||[]).some(p=>p.publish_at))render()},30000);
</script>
</body>
</html>
